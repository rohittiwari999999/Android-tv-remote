name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 4. Build Web Application
        run: |
          npm run build

      - name: 5. Prepare Capacitor Android Platform
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 7. Build Android APKs (Debug & Release)
        run: |
          cd android
          chmod +x gradlew
          # Build installable Android APK
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon || true

      - name: 8. Build Android AAB (Google Play Store Bundle)
        run: |
          cd android
          # Build Android App Bundle for Play Store
          ./gradlew bundleRelease --no-daemon || ./gradlew bundleDebug --no-daemon

      - name: 9. Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-TV-Remote-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 10. Upload AAB (Play Store Bundle) as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-TV-Remote-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
