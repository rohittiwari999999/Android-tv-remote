name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: |
          npm install

      - name: 4. Build Vite Web Application
        run: |
          npm run build

      - name: 5. Install Capacitor & Prepare Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 7. Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 8. Build Android APKs (Debug & Release)
        run: |
          cd android
          chmod +x gradlew
          # Build APK for immediate mobile installation
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: 9. Build Android AAB (Google Play Store Bundle)
        run: |
          cd android
          # Build AAB for Google Play Store console upload
          ./gradlew bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace

      - name: 10. Upload APK File as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-TV-Remote-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 11. Upload AAB (Play Store Bundle) as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-TV-Remote-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
